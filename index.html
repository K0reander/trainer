  return `<div class="card" style="border-color:var(--mid)"><h3>Zeit für einen neuen Schwellentest</h3><p style="margin-top:0">Dein letzter Test liegt ${Math.round(days / 7)} Wochen zurück. Alle 6 bis 8 Wochen lohnt sich ein neuer Test, damit deine Zonen zur Fitness passen.</p>
    <p class="muted" style="font-size:.88rem">20 Minuten voll laufen (nach gutem Einlaufen). Die durchschnittliche Herzfrequenz der letzten 15 Minuten ist deine neue Schwellen-HF. Auf dem Rad wiederholst du den Test.</p>
    <button class="btn small" data-act="iseg" data-v="zone" onclick="state.tab='ironman'">Zonen aktualisieren</button></div>`;
}
function viewHeute(){ return retestCard() + viewHeute0() + freeCard(state.date); }
/* ---- Fortschritt ---- */
function progressCard(){
  const mon = mondayOf(todayStr()), wk = [];
  for (let i = 7; i >= 0; i--) { const m = addDays(mon, -7 * i), r = rangeStats(WD.map((_, j) => addDays(m, j))); wk.push({m, e:r.de, h:r.dh}); }
  const mx = Math.max(1, ...wk.map(w => w.e + w.h));
  const bars = wk.map(w => { const t = w.e + w.h; return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0"><div style="height:90px;width:100%;display:flex;flex-direction:column;justify-content:flex-end"><i style="display:block;height:${w.h / mx * 100}%;background:var(--hard);border-radius:3px 3px 0 0"></i><i style="display:block;height:${w.e / mx * 100}%;background:var(--easy)"></i></div><span class="muted" style="font-size:.68rem">${pd(w.m).getDate()}.${pd(w.m).getMonth() + 1}.</span><span style="font-size:.7rem">${t ? Math.round(t / 6) / 10 : '·'}</span></div>`; }).join('');
  /* Kraft: Gewichtsverlauf */
  const ser = {};
  Object.keys(state.log).sort().forEach(d => { const l = state.log[d]; if (!l.done || !l.ex) return; Object.keys(l.ex).forEach(id => { const w = Number(l.ex[id].w); if (w > 0) (ser[id] = ser[id] || []).push(w); }); });
  const ids = Object.keys(ser).filter(id => ser[id].length >= 2).sort((a, b) => ser[b].length - ser[a].length).slice(0, 6);
  const lines = ids.map(id => {
    const a = ser[id], lo = Math.min(...a), hi = Math.max(...a), rg = hi - lo || 1;
    const pts = a.map((v, i) => `${(i / (a.length - 1) * 118 + 1).toFixed(1)},${(28 - (v - lo) / rg * 26).toFixed(1)}`).join(' ');
    return `<div class="hrrow"><span class="grow"><b style="font-size:.9rem">${esc(EX[id] ? EX[id].n : id)}</b><br><span class="muted" style="font-size:.8rem">${wt(a[0])} → ${wt(a[a.length - 1])}</span></span><svg width="120" height="30" viewBox="0 0 120 30" role="img" aria-label="Gewichtsverlauf"><polyline fill="none" stroke="var(--accent)" stroke-width="2" points="${pts}"/></svg></div>`;
  }).join('');
  return `<div class="card"><h3>Fortschritt</h3><div class="label">Ausdauer pro Woche in Stunden, letzte 8 Wochen</div>
    <div style="display:flex;gap:4px;align-items:flex-end;margin:8px 0">${bars}</div>
    <div class="legend"><span><span class="dot" style="background:var(--easy)"></span>locker</span><span><span class="dot" style="background:var(--hard)"></span>mittel bis hart</span></div>
    <div class="label" style="margin-top:12px">Gewichte im Krafttraining</div>${lines ? `<div class="hrbox">${lines}</div>` : '<p class="muted" style="font-size:.88rem;margin:0">Sobald du eine Übung an mindestens zwei Tagen abgeschlossen hast, erscheint hier der Verlauf.</p>'}</div>`;
}
/* ---- Datensicherung ---- */
function backupCard(){
  return `<div class="card"><h3>Daten sichern</h3><p class="muted" style="font-size:.88rem;margin-top:0">Speichert Plan, Verlauf, Gewichte und Profil als Datei. Damit sicherst du alles oder ziehst auf ein anderes Gerät um. Mach das ab und zu, vor allem vor dem Löschen von Browserdaten.</p>
    <div class="row wrap"><button class="btn small" data-act="export">Sichern (Datei)</button><button class="btn small" data-act="importbtn">Datei laden</button></div>
    <input type="file" id="importFile" accept=".json,application/json" hidden></div>`;
}
async function exportData(){
  const data = {app:'trainer-80-20', v:1, saved:new Date().toISOString(), plan:state.plan, log:state.log, progress:state.progress, profile:state.profile, mine:state.mine, princ:state.princ};
  const name = `training-${todayStr()}.json`, blob = new Blob([JSON.stringify(data)], {type:'application/json'});
  try {
    const file = new File([blob], name, {type:'application/json'});
    if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:'Trainingsdaten'}); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('Datei erstellt', 'Sie liegt in deinen Downloads.');
}
function importData(file){
  if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result);
      if (!d || d.app !== 'trainer-80-20') throw new Error('Das ist keine Sicherung dieser App.');
      state.plan = d.plan || null; state.log = d.log || {}; state.progress = d.progress || {};
      if (d.profile) Object.assign(state.profile, d.profile);
      if (d.mine && d.mine.days) state.mine = d.mine;
      if (d.princ && d.princ.periods) { state.princ = d.princ; PN(); }
      localSave();
      if (DB) { save('plan/main', state.plan); save('profile/main', clone(state.profile)); save('mine/main', clone(state.mine)); princSave(); Object.keys(state.log).forEach(k => save('log/' + k, state.log[k])); Object.keys(state.progress).forEach(k => save('progress/' + k, state.progress[k])); }
      applyPlanDefaults(); render(); toast('Geladen', 'Deine Daten sind wieder da.');
    } catch (e) { toast('Laden fehlgeschlagen', e.message || 'Die Datei ist nicht lesbar.'); }
  };
  rd.readAsText(file);
}
</script>
<script>
/* ---------- Bedienung ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, st = state;
  if (a === 'eq') return;
  switch (a) {
    case 'tab': st.tab = b.dataset.tab; st.tabChosen = true; render(); window.scrollTo(0,0); return;
    case 'dprev': st.date = addDays(st.date,-1); break;
    case 'dnext': st.date = addDays(st.date,1); break;
    case 'dtoday': st.date = todayStr(); break;
    case 'goto': st.date = b.dataset.date; st.tab = 'heute'; st.tabChosen = true; window.scrollTo(0,0); break;
    case 'complete': { const s = sessionFor(st.date); if (s) { s.t === 'kraft' ? completeStrength(st.date) : completeCardio(st.date); } break; }
    case 'reopen': reopen(st.date); break;
    case 'bump': {
      const inp = document.getElementById('w-'+b.dataset.ex);
      if (inp) inp.value = b.dataset.w;
      draftInput(st.date, b.dataset.ex, 'w', 0, b.dataset.w); break;
    }
    case 'rep': {
      const id = b.dataset.ex, i = Number(b.dataset.i), v = b.dataset.v;
      const e = getEx(st.date, id), cur = e && e.reps ? e.reps[i] : '';
      const same = String(cur) === v;
      draftInput(st.date, id, 'r', i, same ? '' : v);
      if (!same) autoRest({value: v, dataset: {ex: id, i: String(i)}});
      break;
    }
    case 'iseg': st.iron.seg = b.dataset.v; break;
    case 'iwk': { const n = Number(b.dataset.n); if (IRON[st.iron.plan].weeks.some(w => w.n === n)) st.iron.week = n; break; }
    case 'sex': setProfile({sex: b.dataset.v}); break;
    case 'unit': setProfile({unit: b.dataset.v}); break;
    case 'pv': st.planView = b.dataset.v; break;
    case 'princ': { const k = b.dataset.v, from = st.princDate || todayStr(); if (k !== 'allg') { const c = progOf(k); if (!c.start) { c.start = from <= todayStr() ? mondayOf(from) : nextMonday(from); } if (k !== 'allg') progPlanMap(k); } princSet(k, from); toast('Prinzip: ' + PRSHORT[k], k === 'allg' ? 'Du trainierst nach deinem Wochenplan.' : 'Die Einheiten stehen jetzt in Heute, Woche und Kalender.'); break; }
    case 'pdel': { st.princ.periods.splice(Number(b.dataset.i), 1); princSave(); break; }
    case 'export': exportData(); return;
    case 'importbtn': { const f = document.getElementById('importFile'); if (f) f.click(); return; }
    case 'xon': { const P = PN(); P.extra.on = !P.extra.on; princSave(); break; }
    case 'xday': { const P = PN(), d = Number(b.dataset.d), i = P.extra.days.indexOf(d); if (i >= 0) P.extra.days.splice(i, 1); else P.extra.days.push(d); P.extra.days.sort(); princSave(); break; }
    case 'movesess': { const el = document.getElementById('moveTo'), to = el && el.value, P = PN(); if (!to) return; if (to === st.date) { toast('Gleicher Tag', 'Wähle einen anderen Tag.'); return; } if (sessionFor(to)) { toast('Tag ist belegt', 'Am ' + fmtDate(to) + ' steht schon eine Einheit. Wähle einen freien Tag.'); return; } P.moves[b.dataset.o] = to; princSave(); st.date = to; toast('Einheit verschoben', 'Neuer Tag: ' + fmtDate(to) + '.'); break; }
    case 'moveundo': { delete PN().moves[b.dataset.o]; princSave(); st.date = b.dataset.o; break; }
    case 'freeadd': freeAdd(); break;
    case 'freedel': freeDel(Number(b.dataset.i)); break;
    case 'pwk': st.princWk = Number(b.dataset.n); break;
    case 'ironuse': { st.princ.iron.plan = st.iron.plan; st.tab = 'setup'; st.planView = 'prinzip'; st.tabChosen = true; window.scrollTo(0,0); toast('Plan vorgemerkt', 'Wähle jetzt oben „Ironman“ und das Startdatum.'); princSave(); break; }
    case 'madd': { const i = b.dataset.d; st.mine.days = st.mine.days || {}; st.mine.days[i] = b.dataset.k === 'kraft' ? {kind:'kraft', title:'Krafttraining', ex:[]} : {kind:'cardio', title:'Ausdauer', mod:'lauf', min:45, z3:0, z45:0}; mineSave(); break; }
    case 'mclear': delete st.mine.days[b.dataset.d]; mineSave(); break;
    case 'mdel': { const d = st.mine.days[b.dataset.d]; if (d && d.ex) d.ex.splice(Number(b.dataset.j), 1); mineSave(); break; }
    case 'mex': addExercise(b.dataset.d); break;
    case 'mapply': applyMine(); window.scrollTo(0,0); break;
    case 'askai': askClaude(); return;
    case 'restsec': setProfile({restSec: Math.min(600, Math.max(15, restSec() + Number(b.dataset.v)))}); break;
    case 'restset': setProfile({restSec: Number(b.dataset.v)}); break;
    case 'resttest': unlockAudio(); beep(); return;
    case 'reststart': unlockAudio(); startRest(restSec(), 'Pause'); return;
    case 'restadd': adjustRest(Number(b.dataset.v)); return;
    case 'restskip': stopRest(); return;
    case 'mode': st.setup.mode = b.dataset.v; break;
    case 'nminus': st.setup.n = Math.max(3, st.setup.n-1); break;
    case 'nplus': st.setup.n = Math.min(6, st.setup.n+1); break;
    case 'mprev': case 'mnext': {
      const [Y,M] = st.calMonth.split('-').map(Number);
      const d = new Date(Y, M-1 + (a==='mnext'?1:-1), 1);
      st.calMonth = `${d.getFullYear()}-${pad(d.getMonth()+1)}`; break;
    }
    case 'stat': st.statMode = b.dataset.v; break;
    case 'apply': {
      princSet('allg', todayStr());
      const p = buildPlan(st.setup.mode, st.setup.n, st.setup.eq.slice());
      p.start = todayStr();
      st.plan = p; save('plan/main', p);
      st.tab = 'heute'; st.tabChosen = true; st.date = todayStr();
      toast('Woche übernommen', 'Heute siehst du dein Training. Im Kalender wird alles abgehakt.');
      window.scrollTo(0,0); break;
    }
    default: return;
  }
  render();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.act === 'eq') {
    const v = t.dataset.v, set = state.setup.eq;
    const i = set.indexOf(v);
    if (t.checked && i < 0) set.push(v);
    if (!t.checked && i >= 0) set.splice(i,1);
    render();
  } else if (t.dataset && t.dataset.act === 'phaseOn') {
    setProfile({phaseOn: t.checked}); render();
  } else if (t.dataset && ['restOn','restAuto','restSound'].includes(t.dataset.act)) {
    setProfile({[t.dataset.act]: t.checked}); render();
  } else if (t.dataset && t.dataset.ex && t.dataset.f === 'r') {
    autoRest(t);
  } else if (t.dataset && t.dataset.pf) {
    const id = t.dataset.pf, val = t.value.trim();
    if (['lthr','lthrBike','ftp','runTP','swimTP'].includes(id) && val) setProfile({lthrDate: todayStr()});
    if (id === 'weight') { const n = parseNum(val); setProfile({weight: n === null ? '' : toKg(n)}); }
    else setProfile({[id]: val});
    render();
  } else if (t.id === 'importFile') {
    importData(t.files && t.files[0]); t.value = '';
  } else if (t.id === 'princDate') {
    state.princDate = t.value || todayStr(); render();
  } else if (t.id === 'princPlan') {
    const k = behaviourFor(todayStr()); progOf(k).plan = t.value; state.princWk = 0; progPlanMap(k); princSave(); render();
  } else if (t.id === 'princRace') {
    const k = behaviourFor(todayStr()); progOf(k).race = t.value; state.princWk = 0; progPlanMap(k); princSave(); render();
  } else if (t.id === 'princLong') {
    const k = behaviourFor(todayStr()); progOf(k).longNow = t.value; state.princWk = 0; progPlanMap(k); princSave(); render();
  } else if (t.id === 'princStart') {
    const k = behaviourFor(todayStr()); progOf(k).start = t.value; state.princWk = 0; princSave(); render();
  } else if (t.id === 'iplan') {
    state.iron.plan = t.value; state.iron.week = IRON[t.value].weeks[0].n; render();
  } else if (t.id === 'iweek') {
    state.iron.week = Number(t.value); render();
  } else if (t.id === 'ifam') {
    state.iron.fam = t.value; render();
  } else if (t.id === 'phaseSel') {
    setProfile({phaseMode: t.value}); render();
  } else if (t.id === 'sel') {
    const v = t.value;
    setSession(state.date, v === 'plan' ? null : Number(v));
    render();
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (!t.dataset) return;
  if (t.id === 'isearch') {
    state.iron.q = t.value; const q = t.value.trim().toLowerCase();
    document.querySelectorAll('.irow').forEach(r => { const c = r.querySelector('[data-code]'); r.hidden = !!q && !(c && c.dataset.code.toLowerCase().includes(q)); });
    return;
  }
  if (t.dataset.mg) { state.mine[t.dataset.mg] = t.value; mineSave(); return; }
  if (t.dataset.m) { mineInput(t); return; }
  if (!t.dataset.ex) return;
  draftInput(state.date, t.dataset.ex, t.dataset.f, Number(t.dataset.i||0), t.value);
  if (t.dataset.f === 'r') {
    const v = String(t.value).trim(), n = Number(v), row = t.closest('.setrow');
    t.classList.toggle('ok', v !== '' && n >= Number(t.dataset.t || 9));
    t.classList.toggle('on', v !== '');
    if (row) row.querySelectorAll('.chip').forEach(c => { c.classList.remove('on', 'ok'); c.setAttribute('aria-pressed', 'false'); });
  }
});
document.addEventListener('focusout', () => {
  setTimeout(() => {
    const a = document.activeElement;
    if (dirty && !(a && a.tagName === 'INPUT')) render();
  }, 60);
});

/* ---------- Start ---------- */
function applyPlanDefaults(){
  if (state.plan && MODES[state.plan.mode]) {
    state.setup.mode = state.plan.mode; state.setup.n = state.plan.n; state.setup.eq = state.plan.eq.slice();
  }
}
function firstTab(){
  if (!state.tabChosen) state.tab = state.plan ? 'heute' : 'setup';
}
async function boot(){
  localLoad();
  applyPlanDefaults(); firstTab(); render();
  let db = null;
  try { db = window.claude ? await window.claude.use('db') : null; } catch(e){ db = null; }
  if (!db) { setSync('Nur auf diesem Gerät gespeichert'); return; }
  DB = db;
  state.plan = null; state.log = {}; state.progress = {};
  setSync('Verbunden');
  let planSeen = false;
  const onErr = () => setSync('Verbindung unterbrochen');
  db.doc('plan/main').onSnapshot(snap => {
    state.plan = snap.exists ? clone(snap.data()) : null;
    if (!planSeen) { planSeen = true; applyPlanDefaults(); firstTab(); }
    scheduleRender();
  }, onErr);
  db.doc('profile/main').onSnapshot(snap => {
    if (snap.exists) Object.assign(state.profile, clone(snap.data()));
    scheduleRender();
  }, onErr);
  db.doc('princ/main').onSnapshot(snap => {
    if (snap.exists) { const d = clone(snap.data()); state.princ = {periods: d.periods || [], iron: d.iron || {plan:'I1', start:''}, run: d.run || {plan:'HM', start:''}, extra: d.extra, moves: d.moves}; PN(); }
    scheduleRender();
  }, onErr);
  db.doc('mine/main').onSnapshot(snap => {
    const d = snap.exists ? snap.data() : null;
    state.mine = d && d.days ? clone(d) : {days:{}};
    scheduleRender();
  }, onErr);
  db.collection('log').onSnapshot(snap => {
    const o = {}; snap.docs.forEach(d => { o[d.id] = clone(d.data()); });
    state.log = o; scheduleRender();
  }, onErr);
  db.collection('progress').onSnapshot(snap => {
    const o = {}; snap.docs.forEach(d => { o[d.id] = clone(d.data()); });
    state.progress = o; scheduleRender();
  }, onErr);
}
boot();
</script>

if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); }); }
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
